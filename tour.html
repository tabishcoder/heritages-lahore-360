<!DOCTYPE html>
<html lang="en" class="tour">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Lahore Heritage 360° Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/pannellum/pannellum.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <div id="pano"></div>

  <div class="topbar">
    <a class="icon-btn" href="index.html" title="Home" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="scene-title">
      <span id="scene-group"></span>
      <h1 id="scene-name"></h1>
    </div>
    <div class="tools">
      <button class="pill" id="tour-pill" type="button"></button>
      <button class="icon-btn" id="btn-rotate" title="Auto-rotate" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn hide-sm" id="btn-fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <nav class="drawer" id="drawer">
    <div class="drawer__bar" id="tabs">
      <button class="drawer__toggle" id="drawer-toggle" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>
        Locations
      </button>
    </div>
    <div class="strip" id="strip"></div>
  </nav>

  <script src="assets/vendor/pannellum/pannellum.js"></script>
  <script src="assets/js/tour-data.js"></script>
  <script src="assets/js/heritage-data.js"></script>
  <script src="assets/js/game.js"></script>
  <script src="assets/js/tour.js"></script>
</body>
</html>
